<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fly World Model</title>
  <link rel="stylesheet" href="style.css">
  <!-- 층 계산 화면의 수식 (KaTeX) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/onnxruntime-web@1.20.1/dist/ort.min.js"></script>
  <script type="importmap">
    { "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    } }
  </script>
</head>
<body data-source="local">
  <header>
    <h1>Fly World Model</h1>
    <div class="controls">
      <div class="seg" id="src-mode" title="What the world model and brain panels show">
        <button data-src="real" class="on">Real play</button>
        <button data-src="dream">Imagination</button>
      </div>
      <div class="seg" id="mode">
        <button data-mode="brain" class="on">Connectome brain</button>
        <button data-mode="human">Keyboard</button>
      </div>
      <button id="pause">Pause</button>
      <button id="reset">Reset</button>
      <label>Level <select id="level">
        <option value="0">0 · no predator</option><option value="1">1 · slow predator</option>
        <option value="2">2 · full predator</option>
      </select></label>
      <label>Speed <select id="speed">
        <option value="0.5">0.5×</option><option value="1" selected>1×</option>
        <option value="2">2×</option><option value="4">4×</option>
      </select></label>
      <span id="status" class="muted">Loading…</span>
    </div>
  </header>

  <main class="explorer">
    <div class="left">
      <!-- 왼쪽 세로 한 칸: 월드모델과 뇌의 층 구조를 하나의 그림으로 (둘 사이 화살표가 끊기지 않게) -->
      <div class="flow"><svg id="flow-svg" viewBox="0 0 360 517" role="img" aria-label="World model and fly brain layers with the senses and actions they exchange"></svg></div>

      <!-- 오른쪽 위: 월드모델 상세 화면 -->
      <section class="panel half wm">
        <div class="panel-head">
          <h2>World model</h2>
          <span class="muted" id="wm-num"></span>
        </div>
          <div class="detail" id="wm-detail">
            <div class="view" id="wmv-statemap">
              <h3>State map <span class="muted">· model state (h<sub>t</sub>, z<sub>t</sub>), 512-d, reduced to 2-D by PCA</span></h3>
              <div class="wm-block" id="wm">
                <canvas id="state-map" height="300"></canvas>
                <div class="legend" id="map-legend"></div>
                <div class="wm-empty" id="wm-empty">World model not trained yet</div>
              </div>
            </div>
            <div class="view" id="wmv-layer" hidden>
              <div id="wml-head"></div>
              <div id="wml-steps" class="xd-steps"></div>
              <div id="wml-tex" class="xd-tex"></div>
              <canvas id="wml-canvas"></canvas>
            </div>
          </div>
      </section>

      <!-- 오른쪽 아래: 초파리 뇌 상세 화면 -->
      <section class="panel half br">
        <div class="panel-head">
          <h2>Fly brain</h2>
        </div>
          <div class="detail" id="brain-detail">
            <div class="view fill" id="brv-map">
              <div id="brain-view"><div id="tooltip"></div></div>
              <div class="brain-bar">
                <div class="seg small" id="brain-mode">
                  <button data-v="live" class="on">Real</button>
                  <button data-v="dream">Imagined</button>
                </div>
              </div>
              <div class="legend" id="legend"></div>
            </div>
            <div class="view" id="brv-layer" hidden>
              <div id="brl-head"></div>
              <div id="brl-steps" class="xd-steps"></div>
              <div id="brl-tex" class="xd-tex"></div>
              <div class="xd-row">
                <!-- Sensory → Adaptation 왼쪽: 지금 뇌가 받는 관측을 막대로 (explorer.js) -->
                <div id="brl-sense" class="xd-side" hidden>
                  <div class="xd-side-title" id="brl-sense-title"></div>
                  <div class="sense">
                    <div class="sense-row lr-head"><span></span><div class="lr"><span>L</span><span>R</span></div></div>
                    <div class="sense-row"><span>Food odor</span><div class="lr" id="bs-food"></div></div>
                    <div class="sense-row"><span>CO₂</span><div class="lr" id="bs-co2"></div></div>
                    <div class="sense-row"><span>Eyes</span><canvas id="bs-eyes"></canvas></div>
                  </div>
                </div>
                <canvas id="brl-canvas"></canvas>
              </div>
            </div>
          </div>
      </section>
    </div>

    <!-- 오른쪽 1/3: 게임 -->
    <section class="panel game">
      <div class="panel-head">
        <h2>Game</h2>
        <span class="muted" id="game-info"></span>
      </div>
      <canvas id="game" width="480" height="480"></canvas>
      <div class="stats">
        <div><b id="score">0</b><span>Food</span></div>
        <div><b id="total">0</b><span>Return</span></div>
        <div><b id="step">0</b><span>Step</span></div>
        <div><b id="episode">1</b><span>Episode</span></div>
      </div>
      <h3>Reward <span class="muted" id="reward-num"></span></h3>
      <canvas id="reward-chart" height="70"></canvas>
      <p class="muted hint" id="hint">Keyboard: ↑↓ forward/back, ←→ turn, Space jump</p>
      <label class="muted ghost-toggle"><input type="checkbox" id="ghost">
        Show imagined path <span class="ghost-key"></span> where the fly would go if it followed its imagined actions (next 15 steps)</label>
      <h3>Events</h3>
      <ul id="events"></ul>
    </section>
  </main>

  <script type="module" src="main.js"></script>
</body>
</html>
